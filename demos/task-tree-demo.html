let tasks=initial();
function descendants(id){return tasks.filter(t=>t.parentId===id).flatMap(t=>[t,...descendants(t.id)]);}
function matching(f){return tasks.filter(t=>(!f.q||[t.id,t.title,t.owner].join(' ').toLowerCase().includes(f.q.toLowerCase()))&&(!f.type||t.type===f.type)&&(!f.state||t.state===f.state)&&(!f.signal||(f.signal==='需关注'?t.signals.some(s=>['依赖阻塞','执行状态未知'].includes(s)):t.signals.includes(f.signal))));}

y>任务流水 · ${t.logs.length}条</summary><div class="history">${t.logs.map(l=>`<p>${esc(l)}</p>`).join('')}</div></details>`;}
function show(id,open=false){selected=id;render();if(open||innerWidth<=1000){$('#detail').innerHTML=detail(tasks.find(t=>t.id===id));if(!$('#dialog').open)$('#dialog').showModal();}}
function render(){const f=filters(),{matches,ids}=visible(f),filtered=Object.values(f).some(Boolean),matchIds=new Set(matches.map(t=>t.id));$('#count').textContent=`匹配 ${matches.length}个任务 / 全部 ${tasks.length}个任务（含父任务）；${mode==='tree'?'保留祖先路径，祖先不额外计入匹配数。':'按任务平铺，不重复统计。'}`;$('#heading').textContent=mode==='tree'?'全部任务 · 拆解树':'全部任务 · 列表';$('#tree').classList.toggle('on',mode==='tree');$('#list').classList.toggle('on',mode==='list');const rows=[];function row(t,depth){if(!ids.has(t.id))return;const has=tasks.some(x=>x.parentId===t.id);rows.push(`<div class="row ${selected===t.id?'selected':''} ${!matchIds.has(t.id)?'context':''}" data-id="${t.id}"><div class="name" style="padding-left:${depth*20}px"><button class="toggle" data-toggle="${t.id}" aria-label="${collapsed.has(t.id)?'展开':'收起'} ${t.id}" ${has?'':'disabled'}>${has?(collapsed.has(t.id)&&!filtered?'▸':'▾'):'·'}</button><button data-select="${t.id}"><b>${esc(t.title)}</b><small>${depth?'└ ':''}${t.id} · ${t.type}${!matchIds.has(t.id)?' · 祖先路径':''}</small></button></div><span class="owner">${t.owner}</span><span class="badge">${t.state}</span><span class="stage">${t.stage}</span><div class="signal">${badge(t)}</div></div>`);if(mode==='tree'&&(!collapsed.has(t.id)||filtered))tasks.filter(x=>x.parentId===t.id).forEach(c=>row(c,depth+1));}if(mode==='tree')tasks.filter(t=>!t.parentId).forEach(t=>row(t,0));else matches.forEach(t=>row(t,0));$('#rows').innerHTML=rows.join('')||'<p>无匹配任务，请调整筛选。</p>';$('#side').innerHTML=detail(tasks.find(t=>t.id===selected));const alerts=tasks.filter(t=>t.signals.some(s=>['依赖阻塞','执行状态未知'].includes(s))).length,decisions=tasks.filter(t=>t.signals.includes('待人决定')).length;$('#kpis').innerHTML=[['全部任务',tasks.length,'全部对象，含父任务',''],['需关注',alerts,'阻塞或未知的任务','issue'],['待人决定',decisions,'含父任务汇总信号','decision'],['已关单',tasks.filter(t=>t.state==='已关单').length,'当前版本已归档','closed']].map(([n,v,h,k])=>`<button class="kpi" data-kpi="${k}"><b>${v}</b>${n}<small>${h}</small></button>`).join('');}
for(const id of ['search','type','status','signal'])$('#'+id).addEventListener('input',render);$('#tree').onclick=()=>{mode='tree';render()};$('#list').onclick=()=>{mode='list';render()};$('#clear').onclick=()=>{for(const id of ['search','type','status','signal'])$('#'+id).value='';render()};$('#expand').onclick=()=>{collapsed.clear();render()};$('#mobile-detail').onclick=()=>show(selected,true);$('#guide').onclick=()=>{$('#detail').innerHTML=`<h2>统一任务模型 · 设计说明</h2><p>任务可以直接执行，也可以拆成子任务。项目／迭代、功能需求、缺陷、改进、工程任务、调研验证共用身份与父子结构。PRD是关联材料，父任务和子任务不是类型。</p><h3>生命周期</h3><p>草稿 → 待确认 → 已就绪 → 进行中 → 待关单 → 已关单；取消中 → 已取消。重开留理由、增加版本，回待确认。取消不自动传播到子任务。</p><h3>阶段与信号</h3><p>需求 → 计划 → 开发 → 测试／审查 → 合并 → 发布 → 验收 → 关单。按交付范围确定适用门。主脑负责计划拆解，产品经理维护目标与验收要求，人批准关键取舍。作业信号可多选，与生命周期分开。</p><h3>完成约束</h3><p>父任务关单须子任务全部关单及自身验收通过。已取消子任务默认阻断父任务，须另行明确调整父任务范围。当前演示不提供此范围调整操作。执行未知不得自动当作终止；重开后旧证据保留历史，不用于新版本。</p><h3>10个样例</h3><p>T01迭代汇总；T02并行开发；T03接口阻塞；T04待范围决定；T05测试失联；T06资源排队；T07取消核对；T08报告待归档；T09已关单后重开；T10草稿缺材料。</p><p>初始7种生命周期，T07完成核对后展示第8种“已取消”。所有操作仅为内存Mock，不代表V2真实启用。</p>`;$('#dialog').showModal()};$('#reset').onclick=()=>{tasks=initial();selected='T01';collapsed.clear();$('#clear').click();$('#dialog').close();$('#notice').textContent='已恢复10个固定样例。'};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select)show(b.dataset.select);if(b.dataset.toggle){const id=b.dataset.toggle;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render();}if(b.dataset.kpi!==undefined){$('#clear').click();const k=b.dataset.kpi;if(k==='decision')$('#signal').value='待人决定';if(k==='closed')$('#status').value='已关单';if(k==='issue')$('#signal').value='需关注';render();$('#notice').textContent='';}if(b.dataset.action){const host=b.closest('dialog')||$('#side'),reason=host.querySelector('.reason').value,msg=act(selected,b.dataset.action,reason,Number(b.dataset.version));render();if($('#dialog').open)$('#detail').innerHTML=detail(tasks.find(t=>t.id===selected));$('#notice').textContent=msg;}});render();
</script></html>
