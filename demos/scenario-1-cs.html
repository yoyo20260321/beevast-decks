<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>群蜂云枢 · 智能客服工作台</title>
<style>
:root{--bg:#0D1526;--pan:#101B36;--pan2:#16264C;--bd:#22315E;--ac:#00ACBE;--tx:#E8EEF9;--mut:#9FAFD2}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
body{background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;background:var(--pan);padding:12px 22px;border-bottom:1px solid var(--bd)}
.logo{width:14px;height:14px;background:var(--ac);border-radius:4px}
.top b{font-size:16px}.env{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:12px;padding:3px 12px;margin-left:8px}
.langs{margin-left:auto;display:flex;gap:8px;font-size:12px}
.langs span{padding:3px 10px;border-radius:10px;border:1px solid var(--bd);color:var(--mut);cursor:pointer}
.langs span.on{background:var(--ac);color:#04182E;font-weight:700;border-color:var(--ac)}
.online{font-size:12px;color:#4AD98A}
.wrap{display:flex;flex:1;min-height:0}
.side{width:170px;background:var(--pan);border-right:1px solid var(--bd);padding:14px 10px}
.side div{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--mut);margin-bottom:4px;cursor:pointer}
.side div i{width:14px;height:14px;border:1.6px solid var(--mut);border-radius:4px}
.side div.on{background:#16264C;color:#fff}.side div.on i{border-color:var(--ac)}
.side div .bdg{margin-left:auto;background:#FF7B7B;color:#fff;font-size:10.5px;border-radius:8px;padding:1px 7px}
.conv{width:250px;border-right:1px solid var(--bd);overflow:auto;padding:12px}
.cv{background:var(--pan2);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.cv.on{border:1px solid var(--ac)}
.cv .n{font-size:13.5px;font-weight:700}.cv .n i{font-style:normal;font-size:10.5px;color:#0D1526;background:#FFC539;border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700}
.cv .m{font-size:12px;color:var(--mut);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .t{font-size:11px;color:#5E6D92;margin-top:4px}
.chat{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--bd)}
.chead{padding:13px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.chead b{font-size:14.5px}.chead .st{font-size:12px;color:#4AD98A}
.chead .act{margin-left:auto;display:flex;gap:8px}
.chead .act span{font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:4px 10px;color:var(--mut);cursor:pointer}
.chead .act span.hot{border-color:#FF7B7B;color:#FF7B7B}
.msgs{flex:1;padding:18px;overflow:auto}
.m{max-width:72%;margin-bottom:14px;font-size:13.5px;line-height:1.55}
.m .who{font-size:11px;color:#5E6D92;margin-bottom:4px}
.m .b{border-radius:12px;padding:11px 14px}
.m.cu{margin-left:auto}.m.cu .b{background:#1E3A6E}
.m.ai .b{background:var(--pan2);border:1px solid var(--bd)}
.m.ai .sop{margin-top:8px;font-size:11.5px;color:#4AD98A}
.composer{border-top:1px solid var(--bd);padding:12px 16px}
.ai-draft{background:var(--pan);border:1px dashed var(--ac);border-radius:10px;padding:10px 14px;font-size:13px;color:#C9D4E8;margin-bottom:10px}
.ai-draft b{color:var(--ac);font-size:12px}
.btns{display:flex;gap:8px}
.btns span{font-size:12.5px;border-radius:8px;padding:6px 14px;cursor:pointer}
.send{background:var(--ac);color:#04182E;font-weight:700}
.ghost{border:1px solid var(--bd);color:var(--mut)}
.ctx{width:250px;border-left:1px solid var(--bd);padding:14px;overflow:auto}
.ctx h4{font-size:12px;color:var(--mut);margin:12px 0 8px;font-weight:500}
.card{background:var(--pan2);border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:8px;line-height:1.6}
.card b{color:#fff}.card .k{color:var(--mut)}
.strips{display:flex;gap:8px;margin-top:10px}
.strip{flex:1;background:var(--pan2);border-radius:9px;padding:8px;text-align:center}
.strip b{display:block;font-size:16px;color:var(--ac)}.strip span{font-size:10.5px;color:var(--mut)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ac);color:#04182E;font-weight:700;font-size:13px;border-radius:10px;padding:10px 18px;display:none}
</style></head><body>
<div class="top"><div class="logo"></div><b>群蜂云枢 · 智能客服工作台</b><span class="env">跨境物流 · 私有化部署 · Demo</span>
<div class="langs"><span class="on" data-l="zh">中文</span><span data-l="en">EN</span><span data-l="ru">РУС</span></div><span class="online">● 在线 · 7×24</span></div>
<div class="wrap">
<div class="side">
<div class="on"><i></i>会话工作台</div>
<div><i></i>工单中心<span class="bdg">3</span></div>
<div><i></i>知识库</div>
<div><i></i>多语言话术</div>
<div><i></i>数据分析</div>
<div><i></i>设置</div></div>
<div class="conv" id="clist"></div>
<div class="chat">
<div class="chead"><b id="cname">—</b><span class="st">● AI 协同中</span>
<div class="act"><span>识别运单 ✓</span><span>关联订单 ✓</span><span class="hot" onclick="transfer()">转人工</span></div></div>
<div class="msgs" id="msgs"></div>
<div class="composer">
<div class="ai-draft" id="draft"><b>AI 建议回复</b> · <span id="draftBody">—</span></div>
<div class="btns"><span class="send" onclick="send()">发送</span><span class="ghost" onclick="transfer()">转人工</span><span class="ghost">建单催办</span><span class="ghost">补偿申请</span></div></div></div>
<div class="ctx">
<div class="strips"><div class="strip"><b>30s</b><span>首次响应</span></div><div class="strip"><b>92%</b><span>一次解决率</span></div></div>
<h4>客户上下文 · 自动聚合</h4>
<div class="card" id="ctxCard"></div>
<h4>今日工作台</h4>
<div class="card">会话 128 · AI 独立解决 81%<br>转人工 24 · 均已响应</div>
<h4>处理实效</h4>
<div class="card">较人工坐席：首响 <b style="color:#4AD98A">-96%</b> · 夜间无人值守 <b style="color:#4AD98A">0</b> · 单坐席承载 <b style="color:#4AD98A">3×</b></div></div>
</div>
<div class="toast" id="toast">已转人工 · 专员 张敏 接手</div>
<script>
const DATA={
 c1:{n:"Anastasia · 莫斯科",tag:"RU",ctx:"运单 WB-2041 · 莫斯科<br>状态 清关异常（2 天）<br>历史工单 2 条 · 均已闭环",
 msgs:[["cu","客户 · RU","Заказ WB-2041 задерживается на таможне. Когда прибудет? Это уже второй раз!"],
 ["ai","智能客服 · AI 草稿（依据售后 SOP）","Anna, приносим извинения. Посылка WB-2041 проходит таможенное оформление, ожидаемая задержка — 2 дня. Заявка WO-2041 уже создана."],
 ["sys","系统动作","异常建单 WO-2041 → 已分派口岸代理 · 高风险赔付承诺需 人工审批 后发出"]],
 drafts:{zh:"安娜，很抱歉。您的运单 WB-2041 正在清关，预计延误 2 天，已建单 WO-2041 并安排催办，我们会主动同步进度。",
 en:"Anna, sorry for the delay. WB-2041 is under customs clearance (ETA +2 days). Ticket WO-2041 created and being expedited.",
 ru:"Анна, извините. WB-2041 на таможенном оформлении, задержка 2 дня. Заявка WO-2041 создана, мы держим вас в курсе."}},
 c2:{n:"张先生 · 马德里",tag:"ES",ctx:"运单 SB-8871 · 马德里<br>状态 末端派送 · 催办中<br>历史工单 0 条",
 msgs:[["cu","客户 · ES","¿Cuándo llegará mi pedido? Lleva 3 días en reparto."],
 ["ai","智能客服 · AI 草稿","Su pedido SB-8871 está en reparto desde ayer. Si hoy no se entrega, abriremos una reclamación automáticamente."],
 ["sys","系统动作","已向末端网点发起催办 · 预计 24h 内送达"]],
 drafts:{zh:"您的包裹 SB-8871 已于昨日开始派送，如今日未送达，我们将自动发起申诉并优先处理。",
 en:"Your parcel SB-8871 went out for delivery yesterday. If not delivered today, we will auto-escalate.",
 ru:"Su paquete SB-8871 está en reparto. Si no llega hoy, escalaremos automáticamente."}},
 c3:{n:"李女士 · 汉堡",tag:"EN",ctx:"订单 #8821 · 汉堡<br>请求 发票重开<br>历史工单 1 条 · 已闭环",
 msgs:[["cu","客户 · EN","Need a VAT invoice for order #8821, the old one has a wrong address."],
 ["ai","智能客服 · AI 草稿","Sure — I've re-issued VAT invoice #8821-V2 with the corrected address. It's on its way to your email."],
 ["sys","系统动作","发票重开 ✓ · 已同步 ERP"]],
 drafts:{zh:"已为您重开 VAT 发票 #8821-V2（地址已更正），将发送至您的邮箱。",
 en:"VAT invoice #8821-V2 has been re-issued with the corrected address and sent to your email.",
 ru:"VAT invoice #8821-V2 re-issued with corrected address, sent to your email."}}};
let cur="c1",lang="zh";
function loadC(id){cur=id;const d=DATA[id];
 document.getElementById("cname").textContent=d.n;
 document.getElementById("ctxCard").innerHTML=d.ctx;
 renderMsgs();setDraft();
 document.querySelectorAll(".cv").forEach(e=>e.classList.toggle("on",e.dataset.id===id));}
function renderMsgs(){const d=DATA[cur];const box=document.getElementById("msgs");box.innerHTML="";
 d.msgs.forEach(m=>{const div=document.createElement("div");div.className="m "+m[0];
 div.innerHTML=`<div class="who">${m[1]}</div><div class="b">${m[2]}</div>`;box.appendChild(div);});box.scrollTop=box.scrollHeight;}
function setDraft(){document.getElementById("draftBody").textContent=DATA[cur].drafts[lang];}
function send(){const d=DATA[cur];d.msgs.push(["ai","已发送 · "+({zh:"中文",en:"EN",ru:"РУС"})[lang],d.drafts[lang]]);renderMsgs();
 setTimeout(()=>{d.msgs.push(["cu","客户","OK, thank you! 👍"]);if(cur==="c1")renderMsgs();},900);}
function transfer(){const t=document.getElementById("toast");t.style.display="block";setTimeout(()=>t.style.display="none",2200);}
document.querySelectorAll(".langs span").forEach(e=>e.onclick=()=>{document.querySelectorAll(".langs span").forEach(x=>x.classList.remove("on"));e.classList.add("on");lang=e.dataset.l;setDraft();});
loadC("c1");
</script></body></html>
