name: Workflow map isolated browser
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - demos/workflow-demo.html
      - tests/workflow-demo.test.cjs
      - tests/workflow-browser/**
      - .github/workflows/workflow-map-browser.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed main merge SHA for canonical live page verification
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: workflow-map-browser
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_ROOT: ${{ github.workspace }}
      MAP_ARTIFACT_DIR: ${{ runner.temp }}/workflow-map-evidence
      MAP_MODE: ${{ github.event_name == 'workflow_dispatch' && 'live' || 'candidate' }}
      MAP_PORT: '4173'
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/workflow-map-browsers
      npm_config_cache: ${{ runner.temp }}/workflow-map-npm-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Validate provenance and fixed live digest
        run: node tests/workflow-browser/provenance.cjs prepare
      - name: Separate developer selftests
        run: node --test tests/workflow-demo.test.cjs
      - name: Prepare disposable suite and readable Chinese fonts
        run: |
          cp -R tests/workflow-browser "$RUNNER_TEMP/workflow-map-suite"
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install locked tools and bundled Chromium only on runner
        working-directory: ${{ runner.temp }}/workflow-map-suite
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/@playwright/test/cli.js install --with-deps chromium
          node provenance.cjs tools
      - name: Real A-I desktop and mobile browser matrix
        working-directory: ${{ runner.temp }}/workflow-map-suite
        run: npm test
      - name: Final bounded evidence manifest
        if: always()
        env:
          MAP_JOB_STATUS: ${{ job.status }}
        run: node tests/workflow-browser/provenance.cjs finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-map-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-map-evidence/
          if-no-files-found: error
          retention-days: 7
